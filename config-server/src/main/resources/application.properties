spring.application.name=config-server
spring.profiles.active=git
spring.cloud.config.server.git.uri=https://github.com/SormSophat04/bank-config-server-personal.git
spring.cloud.config.server.git.username=sorm_sophat04
spring.cloud.config.server.git.password=${GIT_PAT}
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.default-label=main
server.port=8071

#spring.rabbitmq.host=localhost
#spring.rabbitmq.port=5672
#spring.rabbitmq.username=guest
#spring.rabbitmq.password=guest

management.endpoints.web.exposure.include=*
management.health.rabbit.enabled=true
management.info.env.enabled=true

management.metrics.application= ${spring.application.name}

management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.probes.enabled=true

logging.level.com.banking.config-server=DEBUG
logging.pattern.level= "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"


spring.application.name=loan-service
spring.profiles.active=dev
spring.config.import=optional:configserver:http://localhost:8071/

## MOGNO WITH DOCKER
#spring.data.mongodb.host=mongo-server

# Mongo placeholder
spring.data.mongodb.host=${MONGODB_HOST_NAME:localhost}

spring.data.mongodb.port=27017
spring.data.mongodb.database=loan_service_db
spring.data.mongodb.auto-index-creation=true
server.port=8090

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

management.endpoints.web.exposure.include=*
management.info.env.enabled=true


management.metrics.application= ${spring.application.name}

#management.endpoint.shutdown.access=none

management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.probes.enabled=true

#join with eureka server
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:9000/eureka/

#configuration default endpoint
info.app.name=Loan Microservice
info.app.description=Bank Loan App
info.app.version=0.0.1

# Enable shutdown endpoint
#management.endpoints.shutdown.enabled=true



#Logging
logging.level.com.banking.loan-service=DEBUG
logging.pattern.level= "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"
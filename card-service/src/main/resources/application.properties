spring.application.name=card-service
spring.profiles.active=dev
spring.config.import=optional:configserver:http://localhost:8071/

## Mongo with Docker images
#spring.data.mongodb.host=mongo-server

# Mongo placeholder
spring.data.mongodb.host=${MONGODB_HOST_NAME:localhost}

spring.data.mongodb.port=27017
spring.data.mongodb.database=card_service_db
spring.data.mongodb.auto-index-creation=true
server.port=8091

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.probes.enabled=true

management.metrics.application= ${spring.application.name}

management.endpoints.web.exposure.include=*
management.health.rabbit.enabled=true
management.info.env.enabled=true

#management.endpoint.shutdown.access=none

#join with eureka server
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:9000/eureka/

#configuration default endpoint
info.app.name=Card Microservice
info.app.description=Bank Card App
info.app.version=0.0.1

logging.level.com.banking.card-service=DEBUG
logging.pattern.level= "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"